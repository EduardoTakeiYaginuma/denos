name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar dependências
        run: npm ci

      - name: checar tipos
        run: npx tsc -b

      - name: build de produção
        run: npm run build
